def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
    }
}

apply plugin: "com.android.library"

android {
    namespace "com.snowplowanalytics.react.tracker"
    compileSdkVersion safeExtGet('compileSdkVersion', 35)
    buildToolsVersion safeExtGet('buildToolsVersion', '35.0.0')

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }
    lint {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url "$rootDir/../node_modules/react-native/android"
    }
    mavenCentral()
    google()
    // JustWatch fork of Snowplow Android tracker with pageUrl/referrer support
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/justwatch/snowplow-android-tracker")
        credentials {
            username = System.getenv("GITHUB_ACTOR") ?: System.getenv("GITHUB_USERNAME") ?: "token"
            password = System.getenv("GITHUB_TOKEN") ?: ""
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Required Dependency for the Tracker
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.facebook.react:react-android:+"
    // JustWatch fork with pageUrl/referrer support - published to GitHub Packages
    implementation "com.justwatch:snowplow-android-tracker:2.2.2"
}
